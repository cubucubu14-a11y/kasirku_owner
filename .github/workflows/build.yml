name: Build APK Owner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Generate Flutter project (Android folder)
        run: |
          flutter create --org com.kasirkuowner --project-name kasirku_owner temp_app
          cp -r temp_app/android .
          rm -rf temp_app

      - name: Inject Internet Permission
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/kasirku.jks

      - name: Buat key.properties
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEY_PASS
          keyPassword=$KEY_PASS
          keyAlias=kasirku
          storeFile=kasirku.jks
          EOF

      - name: Konfigurasi Signing Gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
          def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
              namespace = "com.kasirkuowner.kasirku_owner"
              compileSdk = flutter.compileSdkVersion
              compileOptions { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = JavaVersion.VERSION_1_8 }
              defaultConfig {
                  applicationId = "com.kasirkuowner.kasirku_owner"
                  minSdk = 21
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutterVersionCode.toInteger()
                  versionName = flutterVersionName
              }
              signingConfigs {
                  release {
                      keyAlias = keystoreProperties['keyAlias']
                      keyPassword = keystoreProperties['keyPassword']
                      storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword = keystoreProperties['storePassword']
                  }
              }
              buildTypes { release { signingConfig = signingConfigs.release } }
          }
          flutter { source = '../..' }
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK (Signed)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/kasirku-owner-v1.0.0.apk

      - name: Upload APK ke Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasirku-owner-apk
          path: build/app/outputs/flutter-apk/kasirku-owner-v1.0.0.apk
          retention-days: 30
