plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// 1. Baca file key.properties (Dibuat otomatis oleh GitHub Actions)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // GANTI namespace ini jika nama package Anda berbeda (cek di AndroidManifest.xml)
    namespace = "com.example.kasirku_owner" 
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973" // Untuk mengatasi error shared_preferences sebelumnya

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // GANTI applicationId ini jika nama package Anda berbeda
        applicationId = "com.example.kasirku_owner" 
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // 2. Konfigurasi Keystore untuk Rilis
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 3. Gunakan Keystore saat build rilis
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
